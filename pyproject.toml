[project]
name = "query-router"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = ["scikit-learn>=1.3", "pandas>=2.0", "joblib>=1.3", "pyyaml>=6.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
