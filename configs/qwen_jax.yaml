data:
  path: data/synthetic_queries.csv
  query_column: query
  label_column: label
  test_size: 0.2
  seed: 42

labels: [simple, moderate, difficult]

model:
  type: qwen           # frozen Qwen embeddings
  backend: jax         # JAX MLP head on top
  jax:
    hidden_dim: 128
    epochs: 150
    lr: 0.003
    weight_decay: 0.0001
    batch_size: 64
    seed: 0
  qwen:
    model_name: Qwen/Qwen3-0.6B
    batch_size: 16
    max_length: 128
    device: null
  word_ngram_range: [1, 2]
  char_ngram_range: [2, 5]
  min_df: 1
  C: 4.0
  class_weight: balanced
  max_iter: 1000

output:
  model_path: artifacts/router_qwen_jax.joblib
  metrics_path: artifacts/metrics_qwen_jax.json
