data:
  path: data/synthetic_queries.csv
  query_column: query
  label_column: label
  test_size: 0.2
  seed: 42

labels: [simple, moderate, difficult]

model:
  type: tfidf          # features: tfidf | qwen  (qwen = frozen Qwen embeddings)
  backend: jax         # classifier: sklearn | jax
  jax:
    hidden_dim: 64     # 0 = plain softmax regression, >0 = 1-hidden-layer MLP
    epochs: 100
    lr: 0.003
    weight_decay: 0.0001
    batch_size: 64
    seed: 0
  qwen:
    model_name: Qwen/Qwen3-0.6B
    batch_size: 16
    max_length: 128
    device: null
  word_ngram_range: [1, 2]
  char_ngram_range: [2, 5]
  min_df: 1
  C: 4.0
  class_weight: balanced
  max_iter: 1000

output:
  model_path: artifacts/router_jax.joblib
  metrics_path: artifacts/metrics_jax.json
