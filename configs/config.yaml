data:
  path: data/queries.csv        # columns: query,label
  query_column: query
  label_column: label
  test_size: 0.2
  seed: 42

labels: [simple, moderate, difficult]

model:
  type: tfidf                   # tfidf | qwen
  qwen:
    model_name: Qwen/Qwen3-0.6B # or Qwen/Qwen2.5-0.5B
    batch_size: 16
    max_length: 128
    device: null                # null = auto (cuda / mps / cpu)
  word_ngram_range: [1, 2]
  char_ngram_range: [2, 5]
  min_df: 1
  C: 4.0
  class_weight: balanced
  max_iter: 1000

output:
  model_path: artifacts/router.joblib
  metrics_path: artifacts/metrics.json
